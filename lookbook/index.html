<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="format-detection" content="telephone=no">
<title>FonCity Lookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --black: #0a0a0a;
    --btn: #1f1f1f;
    --gray-border: rgba(0,0,0,0.08);
    --gray-line: rgba(0,0,0,0.14);
    --gray-text: #6b6b6b;
    --gray-mid: #4a4a4a;
    --tile: #ffffff;
    --section-spacing: 48px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: #fbfaf8;
    color: var(--black);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1040px; margin: 0 auto; padding: 0 48px; }

  /* PAGE BACKGROUND */
  .page-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .page-bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(20px); transform: scale(1.1); }
  .page-bg-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.90); }

  /* NAV */
  nav.menu-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; flex-wrap: wrap; row-gap: 8px;
    padding: 28px 48px;
    background: transparent;
    transition: background 0.35s ease;
  }
  nav.menu-bar.scrolled { background-size: cover; background-position: top center; }
  .nav-logo {
    font-size: 13px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.92); text-decoration: none; margin-right: 40px; flex-shrink: 0;
  }
  .nav-links { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; row-gap: 6px; }
  nav.menu-bar a:not(.nav-logo) {
    font-size: 10px; font-weight: 400; letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.85); text-decoration: none;
    padding-bottom: 2px; border-bottom: 0.5px solid transparent;
    transition: color 0.35s ease, border-bottom-color 0.35s ease;
  }
  nav.menu-bar a:not(.nav-logo):hover,
  nav.menu-bar a.active { color: #fff; border-bottom-color: rgba(255,255,255,0.6); }
  nav.menu-bar.scrolled .nav-logo,
  nav.menu-bar.scrolled a:not(.nav-logo) { color: rgba(255,255,255,0.92); font-weight: 600; }

  /* HERO */
  header.hero {
    position: relative; width: 100%; min-height: 70vh;
    display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden;
  }
  .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(10,10,10,0.32); z-index: 1; }
  .hero-content { position: relative; z-index: 2; padding: 48px 24px; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 28px; }
  h1 { font-size: clamp(40px, 7vw, 80px); font-weight: 200; letter-spacing: 2px; line-height: 1.1; color: var(--white); margin-bottom: 24px; }
  .hero-divider { width: 40px; height: 0.5px; background: rgba(255,255,255,0.5); margin: 0 auto 24px; }
  .dates { font-size: 13px; font-weight: 300; letter-spacing: 1px; color: rgba(255,255,255,0.85); }

  /* TABS (boxed segmented) */
  .tabbar { padding: 40px 0 8px; }
  .tabs { display: flex; border: 0.5px solid var(--gray-line); border-radius: 4px; overflow: hidden; background: rgba(255,255,255,0.6); }
  .tabs button {
    flex: 1; font-family: inherit; font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase;
    padding: 14px 10px; border: none; background: transparent; color: var(--gray-mid); cursor: pointer;
    transition: background 0.35s ease, color 0.35s ease;
  }
  .tabs button + button { border-left: 0.5px solid var(--gray-line); }
  .tabs button:hover { background: rgba(0,0,0,0.03); }
  .tabs button.active { background: var(--btn); color: var(--white); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* SECTIONS */
  section { padding: var(--section-spacing) 0; border-bottom: 0.5px solid var(--gray-border); }
  section:last-of-type { border-bottom: none; }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--gray-text); margin-bottom: 12px; }
  h2 { font-size: 30px; font-weight: 200; letter-spacing: 0.5px; margin-bottom: 12px; }
  p.lede { font-size: 15px; font-weight: 300; color: var(--gray-mid); line-height: 1.85; max-width: 780px; }
  p.lede strong { font-weight: 500; color: var(--black); }

  /* DAY + LOOK */
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .day-head h2 { margin-bottom: 0; }
  .weather { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-text); }

  .look { padding: 28px 0 36px; border-top: 0.5px solid var(--gray-line); }
  .look:first-of-type { border-top: none; padding-top: 0; }
  .look-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .look-name { font-size: 20px; font-weight: 300; }
  .look-num { font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gray-text); }
  .look-meta { font-size: 13px; font-weight: 300; color: var(--gray-text); letter-spacing: 0.3px; margin-bottom: 18px; }
  .note { font-size: 13px; font-weight: 300; color: var(--gray-mid); padding-left: 14px; border-left: 0.5px solid var(--gray-line); margin: 0 0 18px; max-width: 720px; }
  .note strong { font-weight: 500; color: var(--black); }

  .opt-label { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--black); margin: 22px 0 12px; display: flex; align-items: center; gap: 12px; }
  .opt-label::after { content: ''; flex: 1; height: 0.5px; background: var(--gray-border); }
  .opt-label.shared { color: var(--gray-text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }
  .item { min-width: 0; }
  .item figure { aspect-ratio: 4 / 5; background: var(--tile); border-radius: 4px; overflow: hidden; border: 0.5px solid var(--gray-border); position: relative; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px; gap: 8px; }
  .ph span { font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); line-height: 1.5; }
  .ph em { font-style: normal; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a958e; }
  .ph::before { content: ''; width: 24px; height: 0.5px; background: rgba(0,0,0,0.25); order: 1; }
  .ph em { order: 2; }
  .item-name { font-size: 12.5px; font-weight: 400; line-height: 1.45; margin-top: 9px; }
  .item-src { font-size: 9px; font-weight: 500; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gray-text); margin-top: 3px; }
  .item-tag { font-size: 11px; font-weight: 300; color: var(--gray-text); font-style: italic; }

  .goto { margin-top: 4px; font-family: inherit; font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; background: transparent; border: 0.5px solid var(--black); border-radius: 4px; color: var(--black); padding: 12px 18px; cursor: pointer; transition: background 0.35s ease, color 0.35s ease; }
  .goto:hover { background: var(--btn); color: var(--white); }

  /* COMBOS */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
  .chip { font-family: inherit; font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; border: 0.5px solid var(--gray-line); background: rgba(255,255,255,0.6); color: var(--gray-mid); cursor: pointer; transition: background 0.35s ease, color 0.35s ease; }
  .chip.active { background: var(--btn); color: var(--white); border-color: var(--btn); }
  .combo { padding: 28px 0 32px; border-top: 0.5px solid var(--gray-line); }
  .combo .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .combo-top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .combo-num { font-size: 26px; font-weight: 200; line-height: 1; min-width: 36px; }
  .combo-title { font-size: 15px; font-weight: 300; color: var(--gray-mid); }
  .flag { font-size: 9px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; border: 0.5px solid var(--gray-line); border-radius: 999px; padding: 3px 10px; color: var(--gray-mid); }
  .combo-note { font-size: 12.5px; font-weight: 300; color: var(--gray-text); margin: 2px 0 16px 50px; }

  /* PACKING */
  .progress-wrap { margin-top: 28px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-text); margin-bottom: 10px; }
  .progress-row strong { color: var(--black); font-weight: 600; }
  .bar { height: 3px; background: rgba(0,0,0,0.08); border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; background: var(--black); width: 0; transition: width 0.35s ease; }
  .pack-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .pack-group { margin-top: 36px; }
  .pack-group h3 { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1.5px solid var(--black); margin-bottom: 4px; }
  .pack-group h3 span { color: var(--gray-text); font-weight: 500; }
  .pack-item { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 0.5px solid var(--gray-border); cursor: pointer; user-select: none; }
  .pack-item input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 0.5px solid var(--gray-mid); border-radius: 3px; flex-shrink: 0; display: grid; place-content: center; cursor: pointer; background: var(--white); }
  .pack-item input:checked { background: var(--btn); border-color: var(--btn); }
  .pack-item input:checked::after { content: ''; width: 9px; height: 5px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .pack-thumb { width: 40px; height: 50px; border-radius: 3px; overflow: hidden; background: var(--tile); flex-shrink: 0; border: 0.5px solid var(--gray-border); }
  .pack-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pack-text { flex: 1; min-width: 0; }
  .pack-name { font-size: 14px; font-weight: 300; line-height: 1.45; }
  .pack-sub { font-size: 9px; font-weight: 500; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gray-text); margin-top: 2px; }
  .pack-item.done .pack-name { text-decoration: line-through; color: var(--gray-text); }
  .pack-item.done .pack-thumb { opacity: 0.5; }

  footer { padding: 48px; text-align: center; font-size: 11px; letter-spacing: 1px; color: var(--gray-text); }

  @media (max-width: 1024px) {
    .container { padding: 0 32px; }
    nav.menu-bar { padding: 22px 32px; }
    header.hero { min-height: 55vh; }
  }
  @media (max-width: 640px) {
    .container { padding: 0 20px; }
    nav.menu-bar { padding: 16px 20px; }
    .nav-logo { margin-right: 20px; }
    .nav-links { gap: 16px; }
    nav.menu-bar a:not(.nav-logo) { letter-spacing: 2px; }
    header.hero { min-height: 45vh; padding-top: 40px; }
    h2 { font-size: 22px; }
    .look-name { font-size: 17px; }
    .tabs button { font-size: 9px; letter-spacing: 1.6px; padding: 13px 6px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
    .combo .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .item-name { font-size: 11.5px; }
    .item-src { font-size: 8px; letter-spacing: 1.4px; }
    .ph span { font-size: 8.5px; letter-spacing: 1.4px; }
    .ph em { font-size: 7.5px; }
    .combo-note { margin-left: 0; }
    footer { padding: 40px 20px; }
  }
</style>
</head>

/* ---------- RENDER ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function tile(ref) {
  var id = Array.isArray(ref) ? ref[0] : ref;
  var tag = Array.isArray(ref) ? ref[1] : '';
  var it = I[id];
  var fig = it.img
    ? '<img src="img/' + it.img + '.jpg" alt="' + esc(it.n) + '" loading="lazy" />'
    : '<div class="ph"><span>' + esc(it.n) + '</span><em>Photo to come</em></div>';
  return '<div class="item"><figure>' + fig + '</figure>' +
    '<div class="item-name">' + esc(it.n) + (tag ? ' <span class="item-tag">· ' + esc(tag) + '</span>' : '') + '</div>' +
    '<div class="item-src">' + esc(it.s) + '</div></div>';
}

function renderLookbook() {
  var h = '<section><div class="section-label">The Looks</div><h2>Eleven looks, five days</h2>' +
    '<p class="lede">Every confirmed look by day and event, with options where there is more than one. Breakfast looks come from the <strong>Outfit Combinations</strong> tab. Forecast as of Friday morning.</p></section>';
  DAYS.forEach(function(d) {
    h += '<section><div class="day-head"><h2>' + d.day + '</h2><div class="weather">' + d.weather + '</div></div>';
    d.looks.forEach(function(l) {
      h += '<div class="look"><div class="look-top"><div class="look-name">' + l.name + '</div><div class="look-num">' + l.num + '</div></div>' +
        '<div class="look-meta">' + esc(l.meta) + '</div>';
      if (l.breakfast) {
        h += '<div class="note">Pick from the outfit combinations on the morning.</div>' +
          '<button class="goto" data-goto="combinations">See outfit combinations</button>';
      } else {
        if (l.note) h += '<div class="note">' + esc(l.note) + '</div>';
        l.options.forEach(function(o) {
          if (o.label) h += '<div class="opt-label' + (o.shared ? ' shared' : '') + '">' + o.label + '</div>';
          h += '<div class="grid">' + o.items.map(tile).join('') + '</div>';
        });
      }
      h += '</div>';
    });
    h += '</section>';
  });
  document.getElementById('panel-lookbook').innerHTML = h;
}

function comboHas(c, ids) { return c.items.some(function(r) { var id = Array.isArray(r) ? r[0] : r; return ids.indexOf(id) > -1; }); }
var FILTERS = [
  { k: 'all', t: 'All' },
  { k: 'shorts', t: 'Shorts', ids: ['white-linen-shorts', 'black-linen-shorts', 'beige-linen-shorts', 'blue-crochet-set'] },
  { k: 'skirts', t: 'Skirts and skorts', ids: ['white-mini-skirt', 'yellow-skort'] },
  { k: 'long', t: 'Trousers and jeans', ids: ['black-linen-trousers', 'mom-jeans'] },
  { k: 'dresses', t: 'Dresses', ids: ['animal-maxi', 'black-maxi'] }
];
var activeFilter = 'all';

function renderCombos() {
  var h = '<section><div class="section-label">Outfit Combinations</div><h2>Breakfast and daytime</h2>' +
    '<p class="lede">Fourteen combinations to pick from for breakfast on Saturday, Sunday and Monday, and Tuesday if the extension includes it. Each one is listed with its shoes and bag.</p>' +
    '<div class="filters">' + FILTERS.map(function(f) {
      return '<button class="chip' + (f.k === activeFilter ? ' active' : '') + '" data-filter="' + f.k + '">' + f.t + '</button>';
    }).join('') + '</div></section><section style="padding-top:0">';
  var f = FILTERS.filter(function(x) { return x.k === activeFilter; })[0];
  COMBOS.forEach(function(c, i) {
    if (f.ids && !comboHas(c, f.ids)) return;
    var first = Array.isArray(c.items[0]) ? c.items[0][0] : c.items[0];
    var second = Array.isArray(c.items[1]) ? c.items[1][0] : c.items[1];
    var title = I[first].n + ', ' + I[second].n.charAt(0).toLowerCase() + I[second].n.slice(1);
    h += '<div class="combo"><div class="combo-top"><div class="combo-num">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="combo-title">' + esc(title) + '</div>' + (c.flag ? '<span class="flag">' + c.flag + '</span>' : '') + '</div>' +
      (c.note ? '<div class="combo-note">' + esc(c.note) + '</div>' : '<div style="height:14px"></div>') +
      '<div class="grid">' + c.items.map(tile).join('') + '</div></div>';
  });
  h += '</section>';
  document.getElementById('panel-combinations').innerHTML = h;
}

var KEY = 'foncity-lookbook-packed-v1';
function loadPacked() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
function savePacked(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
var packed = loadPacked();

function packRows() {
  var rows = [];
  PACK.forEach(function(g) {
    var list = g.items.map(function(r) {
      if (Array.isArray(r)) return { id: r[0], n: r[1], img: r[2], s: r[3] || g.g };
      var it = I[r]; return { id: r, n: it.n, img: it.img, s: it.s };
    });
    rows.push({ g: g.g, list: list });
  });
  return rows;
}

function renderPacking() {
  var groups = packRows();
  var total = 0, done = 0;
  groups.forEach(function(g) { g.list.forEach(function(r) { total++; if (packed[r.id]) done++; }); });
  var h = '<section><div class="section-label">Packing List</div><h2>Everything going in the bag</h2>' +
    '<p class="lede">Every item from the looks and combinations, listed once, plus essentials. Ticks are saved on this device.</p>' +
    '<div class="progress-wrap"><div class="progress-row"><span>Packed</span><span><strong id="pk-done">' + done + '</strong> of ' + total + '</span></div>' +
    '<div class="bar"><div id="pk-bar" style="width:' + (total ? done / total * 100 : 0) + '%"></div></div>' +
    '<div class="pack-actions"><button class="goto" id="pk-reset">Clear all ticks</button></div></div></section><section style="padding-top:0">';
  groups.forEach(function(g) {
    var gd = g.list.filter(function(r) { return packed[r.id]; }).length;
    h += '<div class="pack-group"><h3>' + g.g + '<span>' + gd + ' / ' + g.list.length + '</span></h3>';
    g.list.forEach(function(r) {
      h += '<label class="pack-item' + (packed[r.id] ? ' done' : '') + '">' +
        '<input type="checkbox" data-id="' + r.id + '"' + (packed[r.id] ? ' checked' : '') + ' />' +
        '<div class="pack-thumb">' + (r.img ? '<img src="img/' + r.img + '.jpg" alt="" loading="lazy" />' : '') + '</div>' +
        '<div class="pack-text"><div class="pack-name">' + esc(r.n) + '</div><div class="pack-sub">' + esc(r.s) + '</div></div></label>';
    });
    h += '</div>';
  });
  h += '</section>';
  document.getElementById('panel-packing').innerHTML = h;
}

/* ---------- TABS ---------- */
var TABS = ['lookbook', 'combinations', 'packing'];
function show(tab, scroll) {
  if (TABS.indexOf(tab) < 0) tab = 'lookbook';
  TABS.forEach(function(t) { document.getElementById('panel-' + t).classList.toggle('active', t === tab); });
  document.querySelectorAll('[data-tab]').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab && !b.classList.contains('nav-logo')); });
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  if (scroll) {
    var y = document.getElementById('tabs-anchor').getBoundingClientRect().top + window.scrollY - document.getElementById('main-nav').offsetHeight - 8;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }
}

document.addEventListener('click', function(e) {
  var t = e.target.closest('[data-tab]');
  if (t) { e.preventDefault(); show(t.getAttribute('data-tab'), true); return; }
  var g = e.target.closest('[data-goto]');
  if (g) { show(g.getAttribute('data-goto'), true); return; }
  var f = e.target.closest('[data-filter]');
  if (f) { activeFilter = f.getAttribute('data-filter'); renderCombos(); return; }
  if (e.target.id === 'pk-reset') { packed = {}; savePacked(packed); renderPacking(); }
});
document.addEventListener('change', function(e) {
  var id = e.target.getAttribute && e.target.getAttribute('data-id');
  if (!id) return;
  if (e.target.checked) packed[id] = 1; else delete packed[id];
  savePacked(packed); renderPacking();
});

renderLookbook(); renderCombos(); renderPacking();
show((location.hash || '#lookbook').slice(1), false);
window.addEventListener('hashchange', function() { show(location.hash.slice(1), false); });

/* ---------- NAV OVER HERO (matches FonCity) ---------- */
(function() {
  var nav = document.getElementById('main-nav');
  var hero = document.querySelector('header.hero');
  var heroSrc = document.querySelector('.hero-bg img').src;
  function onScroll() {
    if (window.scrollY > hero.offsetHeight - 80) {
      if (!nav.classList.contains('scrolled')) {
        nav.classList.add('scrolled');
        nav.style.backgroundImage = 'linear-gradient(rgba(10,10,10,0.38), rgba(10,10,10,0.38)), url(' + heroSrc + ')';
      }
    } else if (nav.classList.contains('scrolled')) {
      nav.classList.remove('scrolled');
      nav.style.backgroundImage = '';
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  // keep hero content clear of the nav, measured rather than guessed
  function fitHero() { document.querySelector('.hero-content').style.paddingTop = (nav.offsetHeight + 24) + 'px'; }
  window.addEventListener('resize', fitHero);
  fitHero();
})();
</script>
